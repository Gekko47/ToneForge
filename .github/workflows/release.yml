name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release check (Stage 28 gate)
        run: node scripts/release-check.mjs

      - name: Build
        run: npm run build

      - name: Create release zip
        run: |
          cd dist
          zip -r ../toneforge-${{ github.ref_name }}.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: toneforge-${{ github.ref_name }}.zip
          generate_release_notes: true
