name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run canonical verification graph
        run: npm run verify

      - name: Clean-install reproducibility check
        run: npm run clean-install:check

      - name: Release check (human host evidence gate)
        run: npm run release:check

      - name: Release package check
        run: npm run release:package:check

      - name: Create release zip
        run: |
          cd build/release
          zip -r ../../toneforge-${{ github.ref_name }}.zip .
          cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            toneforge-${{ github.ref_name }}.zip
            build/release/**
          generate_release_notes: true
