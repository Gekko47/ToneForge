<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%234f6bed'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='16' font-weight='bold' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E"
    />
    <title>ToneForge</title>
    <!--
      A SECOND PAGE of the ONE task pane, not a second pane.

      The context menu is a task pane command (ADR-0107), so it runs no JavaScript
      of ours and there is nothing that could tell an already-open pane where to
      go. Microsoft documents the alternative: commands sharing a `<TaskpaneId>`
      keep "the pane container open but the contents of the pane will be replaced
      with the corresponding Action SourceLocation" — so the page a command loads
      *is* the instruction. This file is that page.

      It differs from `taskpane.html` in exactly one value, the page the Dashboard
      opens on, because Semantic Review reads the selection on mount (ADR-0108) —
      so the text the user right-clicked arrives with no further wiring.
    -->
    <script
      src="https://officeapis.public.onecdn.static.microsoft/1/office.js"
      type="text/javascript"
    ></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
